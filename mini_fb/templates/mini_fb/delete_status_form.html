<!-- mini_fb/templates/mini_fb/delete_status_form.html -->
{% extends 'mini_fb/base.html' %} {% block content %}

<h3>Are you sure you want to delete this status message?</h3>

{{message}}
<p></p>

<form method="POST">
  {% csrf_token %}
  <input type="submit" value="Yes" />
</form>

<form action="{% url 'show_profile' message.profile.pk %}" method="GET">
  {% csrf_token %}
  <input type="submit" value="No" />
</form>
{% endblock %}
