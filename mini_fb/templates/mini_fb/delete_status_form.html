    Description: This template asks the user for confirmation before deleting
    a status message. It provides options to confirm or cancel the deletion.
-->

{% extends 'mini_fb/base.html' %} {% block content %}
<!-- Heading for the delete confirmation prompt -->
<h3>Are you sure you want to delete this status message?</h3>

<!-- Display the status message that will be deleted -->
{{message}}
<p></p>

<!-- Form to confirm the deletion (POST request) -->
<form method="POST">
  <!-- CSRF token to protect against cross-site request forgery -->
  {% csrf_token %}

  <!-- Submit button for confirming the deletion -->
  <input type="submit" value="Yes" />
</form>

<!-- Form to cancel the deletion and return to the profile page -->
<form action="{% url 'show_profile' message.profile.pk %}" method="GET">
  <!-- CSRF token for the cancel action -->
  {% csrf_token %}

  <!-- Submit button to cancel the deletion -->
  <input type="submit" value="No" />
</form>

{% endblock %}
